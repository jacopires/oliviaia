<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Olivia IA - Dashboard do Agente</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <!-- Theme Config -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        // Deep Space Palette
                        "background-dark": "#0a0a0f",
                        "surface-dark": "#111318",
                        "surface-light": "#1a1d24",
                        "primary": "#10b981",
                        "primary-dark": "#059669",
                        "primary-light": "#34d399",
                        "accent-blue": "#3b82f6",
                        "accent-amber": "#f59e0b",
                        "text-primary": "#f8fafc",
                        "text-secondary": "#94a3b8",
                        "text-tertiary": "#64748b",
                        // Legacy colors (compatibilidade)
                        "background-light": "#f6f8f6",
                        "card-dark": "#16261b",
                        "sidebar-dark": "#0b1610",
                        "surface-border": "#28392e",
                        "border-dark": "#2d4a35",
                        "text-muted": "#9db9a6",
                    },
                    fontFamily: {
                        "sans": ["Inter", "system-ui", "sans-serif"],
                        "display": ["Inter Tight", "Inter", "system-ui", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                        "chat": ["Inter", "sans-serif"]
                    },
                    boxShadow: {
                        "glow-green": "0 0 40px -10px rgba(16, 185, 129, 0.3)",
                        "glow-green-lg": "0 0 60px -10px rgba(16, 185, 129, 0.4)",
                        "glow-blue": "0 0 40px -10px rgba(59, 130, 246, 0.3)",
                        "glow-blue-lg": "0 0 60px -10px rgba(59, 130, 246, 0.4)",
                        "glow-amber": "0 0 40px -10px rgba(245, 158, 11, 0.3)",
                        "glass": "0 8px 32px 0 rgba(0, 0, 0, 0.37)",
                    },
                    backdropBlur: {
                        "xs": "2px",
                    },
                    animation: {
                        "pulse-slow": "pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite",
                        "float": "float 6s ease-in-out infinite",
                        "glow": "glow 2s ease-in-out infinite alternate",
                        "scale-in": "scaleIn 0.3s ease-out forwards",
                    },
                    keyframes: {
                        float: {
                            "0%, 100%": { transform: "translateY(0px)" },
                            "50%": { transform: "translateY(-10px)" },
                        },
                        glow: {
                            "0%": { opacity: "0.5" },
                            "100%": { opacity: "1" },
                        },
                        scaleIn: {
                            "0%": { transform: "scale(0.9)", opacity: "0" },
                            "100%": { transform: "scale(1)", opacity: "1" }
                        }
                    }
                },
            },
        }
    </script>
    <style>
        body {
            font-family: "Inter", sans-serif;
        }

        /* Noise Texture Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            z-index: -1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
        }

        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 20;
        }

        /* Glass Card Effect */
        .glass-card {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Orb Effect */
        .orb {
            position: relative;
            border-radius: 9999px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(16, 185, 129, 0.1));
        }

        /* Fade Out Bottom */
        .fade-out-bottom {
            mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0f;
        }

        ::-webkit-scrollbar-thumb {
            background: #1a1d24;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #10b981;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #10b981;
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #28392e;
            border-radius: 2px;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>

</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
